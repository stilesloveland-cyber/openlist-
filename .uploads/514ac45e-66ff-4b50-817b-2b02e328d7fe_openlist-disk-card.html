<script>
document.addEventListener('DOMContentLoaded', () => {
  const KEY_POS = 'olcc-pos';
  const KEY_FOLD = 'olcc-fold';

  const style = document.createElement('style');
  style.textContent = `
    #olcc {
      position: fixed;
      z-index: 99999;
      left: 18px;
      top: 18px;
      width: 260px;
      overflow: hidden;
      color: #263238;
      font: 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(40,60,80,.16);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      user-select: none;
    }
    #olcc.olcc-folded .olcc-body { display: none; }
    #olcc .olcc-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 34px;
      padding: 0 11px;
      cursor: move;
      font-weight: 600;
      border-bottom: 1px solid rgba(120,140,160,.16);
    }
    #olcc .olcc-arrow {
      opacity: .6;
      transition: transform .2s;
    }
    #olcc.olcc-folded .olcc-arrow { transform: rotate(-90deg); }
    #olcc .olcc-body { padding: 8px 11px 10px; }
    #olcc .olcc-meta {
      margin-bottom: 7px;
      color: #71808b;
      font-size: 11px;
    }
    #olcc .olcc-row { margin: 7px 0; }
    #olcc .olcc-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    #olcc .olcc-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }
    #olcc .olcc-size {
      flex: 0 0 auto;
      color: #687780;
      font-size: 11px;
    }
    #olcc .olcc-track {
      height: 6px;
      overflow: hidden;
      background: rgba(120,140,160,.18);
      border-radius: 99px;
    }
    #olcc .olcc-bar {
      height: 100%;
      min-width: 2px;
      border-radius: inherit;
      background: linear-gradient(90deg,#42b883,#3b9ddd);
    }
    #olcc .olcc-bar.warn {
      background: linear-gradient(90deg,#f6b73c,#ed6a45);
    }
    #olcc .olcc-error {
      padding: 5px 0;
      color: #c65b4b;
      font-size: 12px;
    }
    @media (prefers-color-scheme: dark) {
      #olcc {
        color: #e8edf0;
        background: rgba(28,34,40,.72);
        border-color: rgba(255,255,255,.12);
        box-shadow: 0 8px 28px rgba(0,0,0,.3);
      }
      #olcc .olcc-meta,
      #olcc .olcc-size { color: #9daab2; }
      #olcc .olcc-track { background: rgba(220,230,240,.18); }
    }
  `;
  document.head.appendChild(style);

  const card = document.createElement('section');
  card.id = 'olcc';
  card.innerHTML = `
    <div class="olcc-title">
      <span>磁盘状态</span><span class="olcc-arrow">⌄</span>
    </div>
    <div class="olcc-body">
      <div class="olcc-meta">正在加载...</div>
      <div class="olcc-list"></div>
    </div>
  `;
  document.body.appendChild(card);

  try {
    const pos = JSON.parse(localStorage.getItem(KEY_POS) || 'null');
    if (pos && Number.isFinite(pos.left) && Number.isFinite(pos.top)) {
      card.style.left = `${pos.left}px`;
      card.style.top = `${pos.top}px`;
    }
  } catch (_) {}

  if (localStorage.getItem(KEY_FOLD) === '1') card.classList.add('olcc-folded');

  const title = card.querySelector('.olcc-title');
  let drag = null;
  let moved = false;

  title.addEventListener('pointerdown', e => {
    moved = false;
    const rect = card.getBoundingClientRect();
    drag = {
      id: e.pointerId,
      x: e.clientX,
      y: e.clientY,
      left: rect.left,
      top: rect.top
    };
    title.setPointerCapture(e.pointerId);
  });

  title.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    const nl = Math.max(0, Math.min(drag.left + dx, window.innerWidth - 270));
    const nt = Math.max(0, Math.min(drag.top + dy, window.innerHeight - 46));
    card.style.left = `${nl}px`;
    card.style.top = `${nt}px`;
  });

  title.addEventListener('pointerup', e => {
    if (!drag || drag.id !== e.pointerId) return;
    if (moved) {
      const rect = card.getBoundingClientRect();
      localStorage.setItem(KEY_POS, JSON.stringify({
        left: Math.round(rect.left),
        top: Math.round(rect.top)
      }));
    }
    drag = null;
  });

  title.addEventListener('click', () => {
    if (moved) return;
    const folded = card.classList.toggle('olcc-folded');
    localStorage.setItem(KEY_FOLD, folded ? '1' : '0');
  });

  const formatSize = bytes => {
    bytes = Number(bytes) || 0;
    const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) {
      bytes /= 1024;
      i++;
    }
    return `${bytes.toFixed(i ? 1 : 0)} ${units[i]}`;
  };

  const render = data => {
    const meta = card.querySelector('.olcc-meta');
    const list = card.querySelector('.olcc-list');
    const storages = Array.isArray(data?.storages) ? data.storages : [];

    meta.textContent = data?.updated
      ? `更新于 ${new Date(Number(data.updated) * 1000).toLocaleString()}`
      : '更新时间未知';

    list.innerHTML = storages.length ? storages.map(d => {
      const total = Number(d.total) || 0;
      const used = Number(d.used) || 0;
      const percent = total ? Math.min(100, used / total * 100) : 0;
      return `
        <div class="olcc-row">
          <div class="olcc-line">
            <span class="olcc-name">${String(d.name ?? '未命名磁盘')}</span>
            <span class="olcc-size">${formatSize(used)} / ${formatSize(total)}</span>
          </div>
          <div class="olcc-track">
            <div class="olcc-bar${percent >= 80 ? ' warn' : ''}"
                 style="width:${percent.toFixed(2)}%"></div>
          </div>
        </div>
      `;
    }).join('') : '<div class="olcc-error">暂无磁盘数据</div>';
  };

  const load = async () => {
    if (!localStorage.getItem('token')) {
      card.querySelector('.olcc-meta').textContent = '';
      card.querySelector('.olcc-list').innerHTML = '<div class="olcc-error">登录后显示</div>';
      return;
    }
    try {
      const response = await fetch('/api/fs/get', {
        method: 'POST',
        headers: {
          'Authorization': localStorage.getItem('token') || '',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ path: '/NAS/.disk.json' }),
        cache: 'no-store'
      });
      const json = await response.json();
      const rawUrl = json?.data?.raw_url;
      if (!rawUrl) throw new Error('raw_url not found');

      const url = new URL(rawUrl, location.href);
      url.host = location.host;

      const raw = await fetch(url.href, { cache: 'no-store' });
      render(await raw.json());
    } catch (e) {
      card.querySelector('.olcc-meta').textContent = '读取失败';
      card.querySelector('.olcc-list').innerHTML =
        '<div class="olcc-error">无法获取磁盘状态</div>';
    }
  };

  load();
  setInterval(load, 60000);
});
</script>
